# HalluGuard configuration. Credentials are NOT stored here (see .env.example).

llm:
  generator_model: "gpt-4-turbo-2024-04-09"
  judge_model: "claude-3-5-sonnet-20240620"   # must differ from generator_model
  generation_temperature: 0.2                 # repair and relevance-verification runs
  max_tokens: 512
  max_regeneration_attempts: 3                # k in the verification loop

security:
  tau_secure: 0.70                            # selected by 5-fold CV grid search
  weights:
    vuln: 0.6
    rep: 0.2
    typo: 0.2
  osv_snapshot_date: "2025-03-01"
  typosquat_list_size: 5000

network:
  http_timeout_s: 5.0
  pypi_url: "https://pypi.org/pypi/{package}/json"
  osv_url: "https://api.osv.dev/v1/query"
  libraries_io_url: "https://libraries.io/api/pypi/{package}"

reproducibility:
  seeds: [42, 137, 2024]
  python_version: "3.11.9"
  os: "Ubuntu 22.04 LTS"
