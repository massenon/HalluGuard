services:
  sandbox:
    build:
      context: ../..
      dockerfile: docker/sandbox/Dockerfile
    network_mode: none          # no outbound network during execution
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 2g
    cpus: 2.0
    volumes:
      - ./cases:/cases:ro
      - ../../results/generated:/sandbox/results/generated
    command: ["--cases", "/cases/cases.jsonl", "--out", "/sandbox/results/generated/scr_results.csv"]
