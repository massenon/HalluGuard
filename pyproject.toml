[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "halluguard"
version = "1.0.0"
description = "Registry-aware Chain-of-Verification (CoV-RAG) middleware for validating Python package dependencies in LLM-generated code."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "requests==2.32.3",
    "Levenshtein==0.25.1",
    "PyYAML==6.0.1",
    "numpy==1.26.4",
    "scipy==1.13.1",
]

[project.optional-dependencies]
llm = ["openai==1.35.7", "anthropic==0.34.2"]
figures = ["matplotlib==3.9.0"]
dev = ["pytest==8.2.2", "pytest-cov==5.0.0", "ruff==0.5.0"]

[tool.setuptools.packages.find]
include = ["halluguard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
# Vendored third-party code, redistributed verbatim; not ours to restyle.
# See NOTICE and database/README.md.
extend-exclude = ["database"]
